<div class="page narrow">

  <div class="topbar">

    <div class="formula" id="tex-main"></div>

    <div class="graph-section">
      <div class="graph-head">
        <h2>Live graph</h2>
        <div class="graph-controls">
          <label for="chart-var">Vary</label>
          <select id="chart-var"></select>
        </div>
      </div>
      <div class="chart-wrap">
        <canvas id="chart-canvas" height="220"></canvas>
      </div>
    </div>
  </article>

  <nav class="page-nav">
    <a class="prev" id="prev-link" href="#"></a>
    <a class="next" id="next-link" href="#"></a>
